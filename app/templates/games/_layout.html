{% extends "base.html" %}
{% block content %}
<div class="mb-6 flex items-center justify-between flex-wrap gap-3">
  <div>
    <a href="{{ url_for('main.dashboard') }}" class="text-sm text-white/60 hover:text-neon-cyan">← Barcha o'yinlar</a>
    <h1 class="font-display text-3xl md:text-4xl font-black mt-1">{{ game_title }}</h1>
  </div>
  <div id="game-status" class="text-lg font-bold text-neon-cyan"></div>
</div>
<div class="rounded-2xl bg-bg-800/60 border border-white/10 p-6 backdrop-blur">
  {% block game %}{% endblock %}
</div>
<script src="{{ url_for('static', filename='js/award.js') }}"></script>
{% block game_script %}{% endblock %}
{% endblock %}
