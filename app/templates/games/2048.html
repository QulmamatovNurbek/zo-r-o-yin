{% set game_title="2048" %}{% extends "games/_layout.html" %}
{% block game %}
<div x-data="game2048()" x-init="init()" class="max-w-md mx-auto text-center" @keydown.window="handleKey($event)">
  <div class="flex justify-between items-center mb-4">
    <p class="text-white/70">O'qlardan foydalanib o'ynang. Yutish: 2048</p>
    <div class="bg-bg-800 px-4 py-2 rounded-xl text-lg font-bold border border-white/10 shadow-glow">Score: <span
        x-text="score" class="text-neon-cyan"></span></div>
  </div>

  <div class="bg-[#bbada0] p-3 rounded-xl touch-none mx-auto w-fit" id="grid2048" @touchstart="ts=$event.touches[0]"
    @touchend="handleSwipe($event)">
    <div class="grid grid-cols-4 gap-3 relative">
      <template x-for="r in 4">
        <template x-for="c in 4">
          <div class="w-16 h-16 sm:w-20 sm:h-20 bg-[#cdc1b4] rounded-lg"></div>
        </template>
      </template>
      <template x-for="t in tiles" :key="t.id">
        <div
          class="absolute w-16 h-16 sm:w-20 sm:h-20 rounded-lg flex items-center justify-center font-bold text-2xl sm:text-3xl transition-all duration-150"
          :style="`transform: translate(${(t.c)*100}%, ${(t.r)*100}%); margin-left: ${(t.c)*0.75}rem; margin-top: ${(t.r)*0.75}rem;`"
          :class="getColor(t.val)" x-text="t.val"></div>
      </template>
    </div>
  </div>

  <div class="mt-6 flex justify-center gap-4">
    <button @click="reset()" class="px-6 py-2 rounded-lg border border-white/20 hover:border-neon-pink">Qayta
      boshlash</button>
  </div>

  <div x-show="gameover" class="mt-4 text-2xl font-bold text-neon-pink" style="display:none">O'yin tugadi!</div>
  <div x-show="won" class="mt-4 text-2xl font-bold text-neon-lime" style="display:none">Tabriklaymiz, 2048! 🎉 (+50
    ball)</div>
</div>
{% endblock %}

{% block game_script %}
<script>
  let tileId = 0;
  function game2048() {
    return {
      board: [], tiles: [], score: 0, gameover: false, won: false, ts: null, awarded: false,
      init() { this.reset(); },
      reset() {
        this.board = Array(4).fill().map(() => Array(4).fill(0)); this.tiles = []; this.score = 0; this.gameover = false; this.won = false; this.awarded = false;
        this.addTile(); this.addTile();
      },
      addTile() {
        let empty = [];
        for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!this.board[r][c]) empty.push({ r, c });
        if (!empty.length) return;
        let pos = empty[Math.floor(Math.random() * empty.length)];
        let val = Math.random() < 0.9 ? 2 : 4;
        this.board[pos.r][pos.c] = val;
        this.tiles.push({ id: tileId++, r: pos.r, c: pos.c, val: val });
      },
      getColor(v) {
        const colors = { 2: 'bg-[#eee4da] text-[#776e65]', 4: 'bg-[#ede0c8] text-[#776e65]', 8: 'bg-[#f2b179] text-white', 16: 'bg-[#f59563] text-white', 32: 'bg-[#f67c5f] text-white', 64: 'bg-[#f65e3b] text-white', 128: 'bg-[#edcf72] text-white shadow-[0_0_15px_#edcf72]', 256: 'bg-[#edcc61] text-white shadow-[0_0_20px_#edcc61]', 512: 'bg-[#edc850] text-white shadow-[0_0_25px_#edc850]', 1024: 'bg-[#edc53f] text-white shadow-[0_0_30px_#edc53f]', 2048: 'bg-[#edc22e] text-white shadow-[0_0_40px_#edc22e]' };
        return colors[v] || 'bg-[#3c3a32] text-[#f9f6f2]';
      },
      handleKey(e) {
        if (this.gameover) return;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) { e.preventDefault(); this.move(e.key); }
      },
      handleSwipe(e) {
        if (this.gameover || !this.ts) return;
        let te = e.changedTouches[0]; let dx = te.clientX - this.ts.clientX; let dy = te.clientY - this.ts.clientY;
        if (Math.abs(dx) > Math.abs(dy)) { if (Math.abs(dx) > 30) this.move(dx > 0 ? 'ArrowRight' : 'ArrowLeft'); }
        else { if (Math.abs(dy) > 30) this.move(dy > 0 ? 'ArrowDown' : 'ArrowUp'); }
      },
      move(dir) {
        let moved = false; let b = this.board; let changed = false;
        let dr = dir === 'ArrowDown' ? 1 : dir === 'ArrowUp' ? -1 : 0;
        let dc = dir === 'ArrowRight' ? 1 : dir === 'ArrowLeft' ? -1 : 0;

        // We only update the visual tiles at the end. For simplicity, we just rebuild tiles from board.
        let newBoard = Array(4).fill().map(() => Array(4).fill(0));
        let scoreAdd = 0;

        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            let sr = dr === 1 ? 3 - r : r; let sc = dc === 1 ? 3 - c : c;
            if (b[sr][sc]) {
              let tr = sr, tc = sc;
              while (tr + dr >= 0 && tr + dr < 4 && tc + dc >= 0 && tc + dc < 4 && newBoard[tr + dr][tc + dc] === 0) { tr += dr; tc += dc; }
              if (tr + dr >= 0 && tr + dr < 4 && tc + dc >= 0 && tc + dc < 4 && newBoard[tr + dr][tc + dc] === b[sr][sc] && !newBoard[tr + dr][tc + dc].merged) {
                newBoard[tr + dr][tc + dc] *= 2; newBoard[tr + dr][tc + dc].merged = true;
                scoreAdd += newBoard[tr + dr][tc + dc];
                if (newBoard[tr + dr][tc + dc] === 2048) this.won = true;
                changed = true;
              } else {
                if (tr !== sr || tc !== sc) changed = true;
                newBoard[tr][tc] = newBoard[tr][tc] || b[sr][sc];
              }
            }
          }
        }
        if (changed) {
          for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
            if (typeof newBoard[r][c] === 'number') b[r][c] = newBoard[r][c];
            else b[r][c] = newBoard[r][c] ? newBoard[r][c].valueOf() : 0;
          }
          this.score += scoreAdd;
          this.addTile();
          this.syncTiles();
          this.checkOver();
          if (this.won && !this.awarded) { this.awarded = true; awardPoints('2048', 50); }
        }
      },
      syncTiles() {
        this.tiles = [];
        for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (this.board[r][c]) this.tiles.push({ id: tileId++, r, c, val: this.board[r][c] });
      },
      checkOver() {
        for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
          if (!this.board[r][c]) return;
          if (c < 3 && this.board[r][c] === this.board[r][c + 1]) return;
          if (r < 3 && this.board[r][c] === this.board[r + 1][c]) return;
        }
        this.gameover = true;
      }
    }
  }
</script>{% endblock %}
